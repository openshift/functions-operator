      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: func-operator
          control-plane: controller-manager
        name: func-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: func-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: func-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --leader-elect
                - --health-probe-bind-address=:8081
                - --disable-func-cli-update=true
                - --func-cli-path=/func
                - --metrics-bind-address=:8080
                - --metrics-secure=false
                command:
                - /manager
                env:
                - name: CONSOLE_PLUGIN_IMAGE
                  value: quay.io/redhat-user-workloads/ocp-serverless-tenant/faas-console-plugin@sha256:43b4c00ac8be3090a4336567b4e7a3a10f3b7f935c85ec0015e1345ba951816b
                - name: WATCH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['olm.targetNamespaces']
                - name: SYSTEM_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: quay.io/redhat-user-workloads/ocp-serverless-tenant/functions-operator@sha256:2935c7e30a35c45f799f18650074b70c2dd75d031396de6dd4cbc397a0d1cc4a
                imagePullPolicy: Always
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: "2"
                    memory: 2Gi
                  requests:
                    cpu: 100m
                    memory: 500Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /git-repos
                  name: git-repos
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: func-operator-controller-manager
              terminationGracePeriodSeconds: 10
              volumes:
              - emptyDir: {}
                name: git-repos
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: objectbucket-notifications-adapter
          control-plane: manager
        name: objectbucket-notifications-adapter-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: objectbucket-notifications-adapter
              control-plane: manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: objectbucket-notifications-adapter
                control-plane: manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: NOOBAA_ADAPTER_ID
                  value: mcg-adapter
                - name: NOOBAA_ADAPTER_TOPIC_ARN
                  value: mcg-adapter-connection/connect.json
                - name: NOOBAA_ADAPTER_STORAGECLASS_PATTERN
                  value: .*noobaa\.io$
                - name: RADOSGW_ADAPTER_ID
                  value: rgw-adapter
                - name: RADOSGW_ADAPTER_TOPIC_ARN
                  value: arn:aws:sns:ocs-storagecluster-cephobjectstore::rgw-adapter-notifications
                - name: RADOSGW_ADAPTER_STORAGECLASS_PATTERN
                  value: .*ceph-rgw$
                - name: ADAPTER_PORT
                  value: "8888"
                - name: NOTIFICATIONS_MODE
                  value: http
                image: quay.io/redhat-user-workloads/ocp-serverless-tenant/functions-operator-sources-objectbucket@sha256:965c7d722379a9d63188fea8a929f392dfb69a3650cf4c0c1e3aaaddeff6bf6f
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8888
                  name: notifications
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: objectbucket-notifications-adapter-manager
              terminationGracePeriodSeconds: 10
