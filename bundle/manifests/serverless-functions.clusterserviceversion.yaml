            app: faas-console-plugin
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: faas-console-plugin
            app.kubernetes.io/part-of: faas-console-plugin
          name: faas-console-plugin
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: faas-console-plugin
                app.kubernetes.io/name: faas-console-plugin
            strategy:
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 25%
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app: faas-console-plugin
                  app.kubernetes.io/name: faas-console-plugin
                  app.kubernetes.io/part-of: faas-console-plugin
              spec:
                containers:
                  - args:
                      - --https-port=9443
                    image: quay.io/redhat-user-workloads/ocp-serverless-tenant/faas-console-plugin@sha256:517b53f29ad3e2936aaf67edadbc03aa3a9f144238ca09c32e37c12ab494512d
                    imagePullPolicy: IfNotPresent
                    name: faas-console-plugin
                    ports:
                      - containerPort: 9443
                        protocol: TCP
                    resources:
                      requests:
                        cpu: 10m
                        memory: 50Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - mountPath: /var/cert
                        name: faas-console-plugin-cert
                        readOnly: true
                dnsPolicy: ClusterFirst
                restartPolicy: Always
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: faas-console-plugin
                volumes:
                  - name: faas-console-plugin-cert
                    secret:
                      defaultMode: 420
                      secretName: faas-console-plugin-cert
        - label:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: func-operator
            control-plane: controller-manager
          name: func-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: func-operator
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  app.kubernetes.io/name: func-operator
                  control-plane: controller-manager
              spec:
                containers:
                  - args:
                      - --leader-elect
                      - --health-probe-bind-address=:8081
                      - --disable-func-cli-update=true
                      - --func-cli-path=/func
                      - --metrics-bind-address=:8080
                      - --metrics-secure=false
                    command:
                      - /manager
                    env:
                      - name: WATCH_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.annotations['olm.targetNamespaces']
                      - name: SYSTEM_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    image: quay.io/redhat-user-workloads/ocp-serverless-tenant/functions-operator@sha256:77666f3c8b4cc320610c5539342b67bb2115948cd270bcd9ae87bc833255023d
                    imagePullPolicy: Always
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: "2"
                        memory: 2Gi
                      requests:
                        cpu: 100m
                        memory: 500Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - mountPath: /git-repos
                        name: git-repos
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: func-operator-controller-manager
                terminationGracePeriodSeconds: 10
                volumes:
                  - emptyDir: {}
                    name: git-repos
        - label:
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: objectbucket-notifications-adapter
            control-plane: manager
          name: objectbucket-notifications-adapter-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: objectbucket-notifications-adapter
                control-plane: manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  app.kubernetes.io/name: objectbucket-notifications-adapter
                  control-plane: manager
              spec:
                containers:
                  - args:
                      - --metrics-bind-address=:8443
                      - --leader-elect
                      - --health-probe-bind-address=:8081
                    command:
                      - /manager
                    env:
                      - name: NOOBAA_ADAPTER_ID
                        value: mcg-adapter
                      - name: NOOBAA_ADAPTER_TOPIC_ARN
                        value: mcg-adapter-connection/connect.json
                      - name: NOOBAA_ADAPTER_STORAGECLASS_PATTERN
                        value: .*noobaa\.io$
                      - name: RADOSGW_ADAPTER_ID
                        value: rgw-adapter
                      - name: RADOSGW_ADAPTER_TOPIC_ARN
                        value: arn:aws:sns:ocs-storagecluster-cephobjectstore::rgw-adapter-notifications
                      - name: RADOSGW_ADAPTER_STORAGECLASS_PATTERN
                        value: .*ceph-rgw$
                      - name: ADAPTER_PORT
                        value: "8888"
                      - name: NOTIFICATIONS_MODE
                        value: http
                    image: quay.io/redhat-user-workloads/ocp-serverless-tenant/functions-operator-sources-objectbucket@sha256:08bc22a4abb346c0a52d30865b9581828bd63674bb23bc800a24d17a09854c21
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 8888
                        name: notifications
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: objectbucket-notifications-adapter-manager
                terminationGracePeriodSeconds: 10
