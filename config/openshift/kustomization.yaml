# OpenShift overlay that extends the combined overlay with the faas-console-plugin.
# Deploys func-operator, objectbucket-notifications-adapter, and faas-console-plugin
# in a single namespace.
namespace: func-operator-system

resources:
# Everything from the combined overlay
- ../crd
- ../combined/func-operator
- ../combined/source-objectbucket
# OpenShift console plugin
- console-plugin
# RBAC for ConsolePlugin management
- rbac

patches:
# Add consolePluginEnabled to the controller-config ConfigMap
- path: configmap_patch.yaml
  target:
    kind: ConfigMap
    name: func-operator-controller-config
