apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: func-operator-networkpolicy-manager
  labels:
    app.kubernetes.io/name: func-operator
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - update
  - patch
