apiVersion: functions.dev/v1alpha1
kind: Function
metadata:
  labels:
    app.kubernetes.io/name: func-operator
    app.kubernetes.io/managed-by: kustomize
  name: function-sample
  namespace: default
spec:
  repository:
    url: https://github.com/your-org/your-function.git
    # optional: branch name or full ref (e.g. refs/tags/v1.0.0); defaults to the default branch
    revision: main
    # optional: directory holding the function's func.yaml; defaults to the repository root
    dir: .
    authSecretRef:
      name: git-credentials
  registry:
    authSecretRef:
      name: registry-credentials
