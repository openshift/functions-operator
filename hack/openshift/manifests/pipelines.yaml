---
# Red Hat OpenShift Pipelines (productized Tekton).
# Installed into openshift-operators, which already has a global (AllNamespaces)
# OperatorGroup, so no OperatorGroup is needed here.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-pipelines-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
